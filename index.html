<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>J.M. 2K26 — Jersey Order</title>

<style>
body{
  margin:0;
  background:#0d1117;
  color:#fff;
  font-family:Arial,sans-serif;
}

.wrap{
  max-width:720px;
  margin:auto;
  padding:22px 15px;
}

.card{
  background:#161b22;
  border:1px solid #30363d;
  border-radius:18px;
  padding:24px;
  box-shadow:0 10px 30px #0004;
}

h1{
  text-align:center;
  margin:0;
  font-size:34px;
}

.sub{
  text-align:center;
  color:#aaa;
  margin:7px 0 20px;
}

.price{
  text-align:center;
  font-size:25px;
  font-weight:700;
  margin:18px;
}

label{
  display:block;
  font-weight:700;
  margin:15px 0 7px;
}

input,select{
  width:100%;
  box-sizing:border-box;
  padding:13px;
  border-radius:10px;
  border:1px solid #444;
  background:#0d1117;
  color:white;
  font-size:16px;
}

button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#238636;
  color:#fff;
  font-size:17px;
  font-weight:bold;
  margin-top:20px;
  cursor:pointer;
}

.pay{
  margin-top:20px;
  padding:16px;
  border-radius:12px;
  background:#111827;
}

.bk{
  font-size:22px;
  font-weight:700;
}

.small{
  color:#aaa;
  font-size:13px;
  line-height:1.5;
}

.msg{
  display:none;
  margin-top:18px;
  padding:14px;
  border-radius:10px;
}

.ok{
  background:#12351f;
  border:1px solid #2ea043;
}

.err{
  background:#3b1717;
  border:1px solid #f85149;
}

.pending{
  background:#3b320f;
  border:1px solid #d29922;
}

hr{
  border:0;
  border-top:1px solid #30363d;
  margin:28px 0;
}

.status{
  display:flex;
  gap:8px;
}

.status input{
  flex:1;
}

.status button{
  width:auto;
  margin:0;
  padding:12px 18px;
}
</style>
</head>

<body>

<div class="wrap">
<div class="card">

<h1>J.M. 2K26</h1>
<div class="sub">Batch Jersey Order</div>

<div class="price">Jersey Price: ৳500</div>

<form id="orderForm">

<label>Your Name</label>
<input id="student" required>

<label>Jersey Name</label>
<input id="jerseyName" maxlength="15" required>

<label>Jersey Number</label>
<input id="number" type="number" min="0" max="99" required>

<label>Jersey Size</label>

<select id="size" required>
<option value="">Select size</option>
<option>L</option>
<option>XL</option>
<option>XXL</option>
<option>XXXL</option>
<option>XXXXL</option>
</select>

<label>Your Phone Number</label>
<input id="phone" type="tel" required>

<div class="pay">
<b>bKash Payment</b>

<p>
Send Money:
<span class="bk">01621255476</span>
</p>

<p>
Amount: <b>৳500</b>
</p>

<div class="small">
Payment করার পর Transaction ID নিচে দিন।
Transaction verify করার পর admin order Accept করবে।
</div>

</div>

<label>bKash Transaction ID</label>
<input id="trx" required>

<button type="submit">SUBMIT ORDER</button>

<div id="msg" class="msg"></div>

</form>

<hr>

<h3>Check Order Status</h3>

<div class="status">

<input id="orderId" placeholder="Example: JM26-0001">

<button onclick="checkStatus()">CHECK</button>

</div>

<div id="statusMsg" class="msg"></div>

</div>
</div>


<script>

/* Google Apps Script Web App URL */
const API_URL="https://script.google.com/macros/s/AKfycbzpLyzU6tw3DcHdNUTQqruzHq9Q2WH2DFG_ZFF7hb2L9YfHKUDiBMAKlXN0McuxWBrNmw/exec";


/* Message function */
function show(el,text,good){

  el.style.display="block";

  el.className="msg " + (good ? "ok" : "err");

  el.innerHTML=text;

}


/* Submit Order */

document.getElementById("orderForm").onsubmit=async function(e){

  e.preventDefault();

  if(API_URL.includes("PASTE_")){

    show(
      document.getElementById("msg"),
      "Admin setup বাকি: Apps Script Web App URL বসাতে হবে।",
      false
    );

    return;
  }


  const data={

    action:"createOrder",

    student:document.getElementById("student").value,

    jerseyName:document.getElementById("jerseyName").value,

    number:document.getElementById("number").value,

    size:document.getElementById("size").value,

    phone:document.getElementById("phone").value,

    trx:document.getElementById("trx").value

  };


  try{

    let r=await fetch(API_URL,{

      method:"POST",

      body:JSON.stringify(data)

    });


    let j=await r.json();


    if(j.ok){

      show(

        document.getElementById("msg"),

        "✅ Order submitted!<br>" +
        "Order ID: <b>" + j.orderId + "</b><br>" +
        "Status: 🟡 Payment Verification Pending",

        true

      );

      document.getElementById("orderForm").reset();

    }else{

      show(
        document.getElementById("msg"),
        j.error || "Order submission failed.",
        false
      );

    }


  }catch(error){

    show(
      document.getElementById("msg"),
      "Submission failed. Try again.",
      false
    );

  }

};



/* Check Order Status */

async function checkStatus(){

  if(API_URL.includes("PASTE_")){

    show(
      document.getElementById("statusMsg"),
      "Admin setup বাকি।",
      false
    );

    return;
  }


  let id=document.getElementById("orderId").value.trim();


  if(!id){

    show(
      document.getElementById("statusMsg"),
      "Please enter your Order ID.",
      false
    );

    return;
  }


  try{

    let r=await fetch(
      API_URL +
      "?action=status&orderId=" +
      encodeURIComponent(id)
    );


    let j=await r.json();


    if(!j.ok){

      show(
        document.getElementById("statusMsg"),
        j.error || "Order not found.",
        false
      );

      return;
    }


    let status=j.status;

    let statusClass="pending";

    let icon="🟡";


    if(status==="Accepted"){

      statusClass="ok";

      icon="🟢";

    }

    else if(status==="Rejected"){

      statusClass="err";

      icon="🔴";

    }


    const statusMsg=document.getElementById("statusMsg");

    statusMsg.style.display="block";

    statusMsg.className="msg " + statusClass;

    statusMsg.innerHTML=

      "<b>" + j.orderId + "</b><br>" +

      "Payment: " + icon + " " + status;


  }catch(error){

    show(
      document.getElementById("statusMsg"),
      "Could not check status.",
      false
    );

  }

}

</script>

</body>
</html>
